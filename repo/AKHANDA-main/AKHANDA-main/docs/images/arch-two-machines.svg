<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="An operator workstation performs an operation, hashes the result, builds an entry linked to the previous hash and signs it, then sends only the entry hash to a witness on a separate machine, which co-signs it and keeps its own independent head record.">
  <defs>
    <marker id="tm-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a1e28"/>
    </marker>
  </defs>

  <rect width="880" height="320" fill="#faf9f6"/>

  <text x="30" y="26" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d766b" letter-spacing="1.6">TWO MACHINES, TWO KEYS, ONE CHAIN NEITHER CAN REWRITE ALONE</text>

  <!-- operator -->
  <rect x="30" y="48" width="350" height="204" fill="none" stroke="#14120f" stroke-width="1.5"/>
  <text x="48" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#14120f" letter-spacing="1.2">OPERATOR WORKSTATION</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#4a453d">
    <text x="48" y="100">1 · Erase or carve the media</text>
    <text x="48" y="122">2 · Hash the result</text>
    <text x="48" y="144">3 · Build the entry, link to prev_hash</text>
    <text x="48" y="166">4 · Sign with the operator key</text>
  </g>
  <rect x="48" y="184" width="314" height="52" fill="#f2f0eb" stroke="#ddd9d1"/>
  <text x="62" y="205" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7d766b">chain.json   seq 0 -&gt; 1 -&gt; 2 -&gt; …</text>
  <text x="62" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#2c6249">operator_sig ok    concur_sig ok</text>

  <!-- transport -->
  <line x1="380" y1="112" x2="496" y2="112" stroke="#7a1e28" stroke-width="1.5" marker-end="url(#tm-arrow)"/>
  <text x="438" y="102" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7a1e28" text-anchor="middle">entry_hash only</text>
  <text x="438" y="126" font-family="Helvetica,Arial,sans-serif" font-size="10" fill="#7d766b" text-anchor="middle">32 bytes</text>

  <line x1="496" y1="176" x2="380" y2="176" stroke="#7a1e28" stroke-width="1.5" marker-end="url(#tm-arrow)"/>
  <text x="438" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" fill="#7a1e28" text-anchor="middle">co-signature + head</text>

  <!-- witness -->
  <rect x="500" y="48" width="350" height="204" fill="none" stroke="#7a1e28" stroke-width="1.5"/>
  <text x="518" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7a1e28" letter-spacing="1.2">WITNESS, SEPARATE MACHINE</text>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12.5" fill="#4a453d">
    <text x="518" y="100">Holds its own signing key</text>
    <text x="518" y="122">The operator cannot read it</text>
    <text x="518" y="144">Co-signs each entry hash</text>
    <text x="518" y="166">Keeps its OWN head record</text>
  </g>
  <rect x="518" y="184" width="314" height="52" fill="#f8eff0" stroke="#7a1e28"/>
  <text x="532" y="205" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7a1e28">witness_log.jsonl   append only</text>
  <text x="532" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7a1e28">an independent count of what it saw</text>

  <line x1="30" y1="272" x2="850" y2="272" stroke="#ddd9d1" stroke-width="1"/>
  <text x="30" y="292" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4a453d">The witness never sees the evidence, only a 32 byte digest, so co-signing transfers no custody. Rewrite the</text>
  <text x="30" y="308" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4a453d">workstation chain and the witness count no longer matches. That is the property no single machine can offer.</text>
</svg>
