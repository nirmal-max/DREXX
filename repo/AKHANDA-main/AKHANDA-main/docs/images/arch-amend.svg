<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" role="img" aria-label="A five entry chain. Entry seq 2 is superseded but remains in the chain unchanged. Entry seq 4 is an AMEND that names seq 2 and its hash, correcting it by appending rather than by editing.">
  <defs>
    <marker id="am-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7d766b"/>
    </marker>
    <marker id="am-arrow-ox" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#7a1e28"/>
    </marker>
  </defs>

  <rect width="880" height="330" fill="#faf9f6"/>

  <text x="30" y="30" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7d766b" letter-spacing="1.6">CORRECTION WITHOUT MUTATION, ENTRY FORMAT v4</text>

  <!-- amend back-reference, drawn above the row -->
  <path d="M770,146 L770,86 L410,86 L410,140" fill="none" stroke="#7a1e28" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#am-arrow-ox)"/>
  <text x="590" y="78" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" fill="#7a1e28" text-anchor="middle">amends_seq = 2   ·   amends_hash = 9f2c…a7</text>

  <!-- chain link arrows -->
  <g stroke="#7d766b" stroke-width="1.2" marker-end="url(#am-arrow)">
    <line x1="170" y1="178" x2="196" y2="178"/>
    <line x1="340" y1="178" x2="366" y2="178"/>
    <line x1="510" y1="178" x2="536" y2="178"/>
    <line x1="680" y1="178" x2="706" y2="178"/>
  </g>

  <!-- seq 0 -->
  <rect x="30" y="150" width="140" height="56" fill="none" stroke="#14120f" stroke-width="1.3"/>
  <text x="100" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#14120f" text-anchor="middle">seq 0</text>
  <text x="100" y="192" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a453d" text-anchor="middle">RECOVER</text>

  <!-- seq 1 -->
  <rect x="200" y="150" width="140" height="56" fill="none" stroke="#14120f" stroke-width="1.3"/>
  <text x="270" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#14120f" text-anchor="middle">seq 1</text>
  <text x="270" y="192" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a453d" text-anchor="middle">ERASE</text>

  <!-- seq 2, superseded but untouched -->
  <rect x="370" y="150" width="140" height="56" fill="#f2f0eb" stroke="#8a6a12" stroke-width="1.6"/>
  <text x="440" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#8a6a12" text-anchor="middle">seq 2</text>
  <text x="440" y="192" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#8a6a12" text-anchor="middle">ERASE · superseded</text>
  <text x="440" y="228" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a6a12" text-anchor="middle" font-weight="bold">still in the chain</text>
  <text x="440" y="243" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a6a12" text-anchor="middle">still hashes to its</text>
  <text x="440" y="258" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a6a12" text-anchor="middle">recorded value</text>

  <!-- seq 3 -->
  <rect x="540" y="150" width="140" height="56" fill="none" stroke="#14120f" stroke-width="1.3"/>
  <text x="610" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#14120f" text-anchor="middle">seq 3</text>
  <text x="610" y="192" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a453d" text-anchor="middle">RECOVER</text>

  <!-- seq 4, the amendment -->
  <rect x="710" y="150" width="140" height="56" fill="#f8eff0" stroke="#7a1e28" stroke-width="1.8"/>
  <text x="780" y="173" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#7a1e28" text-anchor="middle">seq 4</text>
  <text x="780" y="192" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#7a1e28" text-anchor="middle" font-weight="bold">AMEND</text>
  <text x="780" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7a1e28" text-anchor="middle">amend_reason =</text>
  <text x="780" y="243" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10.5" fill="#7a1e28" text-anchor="middle">TRANSCRIPTION_ERROR</text>
  <text x="780" y="258" font-family="Helvetica,Arial,sans-serif" font-size="10.5" fill="#7d766b" text-anchor="middle">from a closed vocabulary</text>

  <line x1="30" y1="284" x2="850" y2="284" stroke="#ddd9d1" stroke-width="1"/>
  <text x="30" y="304" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4a453d">An amendment is appended, never applied. The superseded entry is not edited, so its hash, its signatures and the</text>
  <text x="30" y="320" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#4a453d">witness head all remain valid. Without this, an honest correction is indistinguishable from tampering.</text>
</svg>
