[package]
name = "akhanda-verify"
version = "0.1.0"
edition = "2021"
description = "Independent verifier for Akhanda chains. Third implementation of one contract."
license = "Apache-2.0"

[dependencies]
sha2 = "0.10"
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
panic = "abort"
overflow-checks = true
