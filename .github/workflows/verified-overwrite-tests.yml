name: DREX Verified Overwrite Tests

on:
  push:
    branches: [repair/production-ready]
  pull_request:
    branches: [repair/production-ready]

jobs:
  overwrite-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Drive Erasure/verified_overwrite_v2.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests
