name: DREX File Slack Cluster Tip Tests

on:
  push:
    branches: [repair/production-ready]
  pull_request:
    branches: [repair/production-ready]

jobs:
  slack-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: File-Folder Erasure/File_Slack_Cluster_Tip_Sanitization_Production_Component_v0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests
