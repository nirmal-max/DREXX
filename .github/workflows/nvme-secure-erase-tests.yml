name: DREX NVMe Secure Erase Tests

on:
  push:
    branches: [repair/production-ready]
  pull_request:

jobs:
  test-nvme:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Drive Erasure/nvme_secure_erase_v2.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Run NVMe tests
        run: python -m pytest -q
