name: Media Destruction Regression

on:
  push:
    branches: ["repair/production-ready-cli-fix"]
  pull_request:
    branches: ["repair/production-ready-cli-fix"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Drive Erasure/Media Destruction/media_destruction_v2.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Run regression suite
        run: python -m pytest -q
      - name: Repeat regression suite 100 times
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            echo "Regression run $i/100"
            python -m pytest -q
          done
