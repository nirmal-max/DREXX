name: ATA Secure Erase Tests

on:
  push:
    branches:
      - repair/production-ready
  pull_request:
    branches:
      - repair/production-ready

jobs:
  ata-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Drive Erasure/ata_secure_erase_v2.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run ATA unit tests
        run: python -m pytest -q
