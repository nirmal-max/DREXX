name: Smart Sanitization Tests
on:
  push:
    branches: [repair/production-ready]
  pull_request:
    branches: [repair/production-ready]
jobs:
  smart-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q "Drive Erasure/smart_sanitization_v2.1.0/tests"
