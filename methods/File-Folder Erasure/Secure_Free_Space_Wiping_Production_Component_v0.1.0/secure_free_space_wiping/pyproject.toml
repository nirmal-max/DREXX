[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-free-space-wiping"
version = "0.1.0"
description = "Allocation-based free-space sanitization for explicitly selected filesystems"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
free-space-wipe = "free_space_wiper.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
