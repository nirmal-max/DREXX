[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-slack-cluster-tip-sanitization"
version = "0.1.0"
description = "Conservative filesystem-aware file-slack sanitization component"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
slack-sanitize = "slack_sanitizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
