[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-pass-zero-overwrite"
version = "0.1.0"
description = "Safety-first single-pass zero overwrite for applicable regular files"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
zero-overwrite = "zero_overwrite.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
