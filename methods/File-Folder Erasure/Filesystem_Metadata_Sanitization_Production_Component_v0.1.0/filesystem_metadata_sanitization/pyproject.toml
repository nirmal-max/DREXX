[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filesystem-metadata-sanitization"
version = "0.1.0"
description = "Conservative filesystem metadata sanitization component"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
metadata-sanitize = "metadata_sanitizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
