[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "temporary-cache-residual-trace-sanitization"
version = "0.1.0"
description = "Policy-driven temporary/cache/residual-trace sanitization component"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
trace-sanitize = "trace_sanitizer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
