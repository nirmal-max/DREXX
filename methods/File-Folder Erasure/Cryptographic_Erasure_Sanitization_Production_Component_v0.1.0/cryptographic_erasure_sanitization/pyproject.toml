[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="cryptographic-erasure-sanitization"
version="0.1.0"
description="Cryptographic erasure sanitization component with key-destruction abstraction"
requires-python=">=3.10"
license={text="MIT"}
dependencies=["cryptography>=42"]

[project.scripts]
crypto-sanitize="crypto_eraser.cli:main"

[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
