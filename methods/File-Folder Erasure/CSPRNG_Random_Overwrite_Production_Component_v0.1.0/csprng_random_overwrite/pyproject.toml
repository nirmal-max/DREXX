[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csprng-random-overwrite"
version = "0.1.0"
description = "CSPRNG random overwrite for applicable regular files"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
csprng-overwrite = "csprng_overwrite.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
