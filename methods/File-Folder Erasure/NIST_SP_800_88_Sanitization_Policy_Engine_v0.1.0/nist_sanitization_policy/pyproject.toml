[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanitization-policy-engine"
version = "0.1.0"
description = "Non-destructive NIST SP 800-88 Rev. 2 based sanitization policy engine"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project implementation"}]
dependencies = []

[project.scripts]
sanitize-policy = "sanitization_policy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
